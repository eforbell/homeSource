<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0b">
  <meta name="referrer" content="no-referrer">
  <title>Home Source — Continuity witness</title>
  <link rel="icon" href="favicon.svg">
  <link rel="stylesheet" href="sovereign-fonts.css"><link rel="stylesheet" href="sovereign-chassis.css"><link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="source-skin.css"><link rel="stylesheet" href="style.css">
  <script src="theme.js"></script>
</head>
<body>
  <main class="page-content" style="max-width:560px; margin:4rem auto; padding:1.5rem;">
    <section class="card" aria-labelledby="page-title">
      <div style="font-size:2rem" aria-hidden="true">🛡️</div>
      <h1 id="page-title">Continuity witness check</h1>
      <p id="summary" class="text-dim">Checking this private witness link…</p>
      <button id="pause-button" class="btn btn-primary" type="button" hidden>Place the one-time 30-day pause</button>
      <p id="status" class="form-hint" role="status" aria-live="polite"></p>
      <p class="form-hint">This link can only pause a continuity delivery run. It cannot open a Home Source account or reveal any letter, document, recipient, envelope, or key.</p>
    </section>
  </main>
  <script>
    'use strict';
    const token = new URLSearchParams(location.search).get('token') || '';
    const summary = document.getElementById('summary');
    const status = document.getElementById('status');
    const button = document.getElementById('pause-button');
    async function request(path) {
      const response = await fetch(path, {
        method:'POST', headers:{ 'Content-Type':'application/json' },
        body:JSON.stringify({ token }), cache:'no-store', credentials:'omit'
      });
      if (!response.ok) throw new Error('This trustee action is unavailable or has expired.');
      return response.json();
    }
    async function validate() {
      try {
        const result = await request('api/continuity/trustee-action/validate');
        if (result.status === 'paused') {
          summary.textContent = 'The one-time pause is already in place.';
          status.textContent = `The fixed pause ends ${new Date(result.pause_deadline_at).toLocaleString()}.`;
          return;
        }
        summary.textContent = 'You may place the one pause shared by all designated witnesses.';
        status.textContent = `This action is available until ${new Date(result.action_deadline_at).toLocaleString()}.`;
        button.hidden = false;
      } catch (error) { summary.textContent = error.message; status.textContent = ''; }
    }
    button.addEventListener('click', async () => {
      if (!window.confirm('Place the one-time 30-day continuity pause? This deadline cannot be extended or restarted.')) return;
      button.disabled = true;
      status.textContent = 'Placing the fixed pause…';
      try {
        const result = await request('api/continuity/trustee-action/pause');
        summary.textContent = result.replayed ? 'The one-time pause was already in place.' : 'The one-time pause is now in place.';
        status.textContent = `The fixed pause ends ${new Date(result.pause_deadline_at).toLocaleString()}.`;
        button.hidden = true;
        history.replaceState(null, '', 'trustee-action.html');
      } catch (error) { status.textContent = error.message; button.disabled = false; }
    });
    validate();
  </script>
</body>
</html>
