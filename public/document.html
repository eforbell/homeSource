  <div class="toast-container" id="toasts"></div>

  <script src="api.js"></script>
  <script src="nav.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/argon2-browser@1.18.0/dist/argon2-bundled.min.js" integrity="sha384-XOR3aNvHciLPIf6r+2glkrmbBbLmIJ1EChMXjw8eBKBf8gE0rDq1TyUNuRdorOqi" crossorigin="anonymous"></script>
  <script>
    'use strict';

    const docId = new URLSearchParams(location.search).get('id');
    if (!docId) location.href = 'documents.html';

    let currentDoc = null;
    let unlockedFiles = new Map();

    function isEncryptedDoc(doc) {
      return !!(doc && (doc.is_encrypted || (doc.encryption_mode && doc.encryption_mode !== 'plaintext')));
    }

    function b64ToBytes(b64) {
      const bin = atob(b64);
      const out = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
      return out;
    }

    function bytesToUtf8(bytes) {
      return new TextDecoder().decode(bytes);
    }

    function safeFileName(name) {
      const cleaned = String(name || 'decrypted-file').replace(/[\\/:*?"<>|]/g, '_').trim();
      return cleaned || 'decrypted-file';
    }

    async function derivePbkdf2Key(passphrase, salt, params = {}) {
      const iterations = Number(params.iterations || 600000);
      const hash = String(params.hash || 'SHA-256');
      const passKey = await crypto.subtle.importKey('raw', new TextEncoder().encode(passphrase), 'PBKDF2', false, ['deriveKey']);
      return crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt, iterations, hash },
        passKey,
        { name: 'AES-GCM', length: 256 },
        false,
        ['decrypt']
      );
    }

    async function deriveArgon2idKey(passphrase, salt, params = {}) {
      if (!window.argon2 || typeof window.argon2.hash !== 'function') {
        throw new Error('Argon2id unavailable in this browser/session');
      }
      const memory_kib = Number(params.memory_kib || 65536);
      const iterations = Number(params.iterations || 3);
      const parallelism = Number(params.parallelism || 1);
      const hash_len = Number(params.hash_len || 32);
      const result = await window.argon2.hash({
        pass: passphrase,
        salt,
        time: iterations,
        mem: memory_kib,
        parallelism,
        hashLen: hash_len,
        type: window.argon2.ArgonType.Argon2id
      });
      const raw = result.hash instanceof Uint8Array ? result.hash : new Uint8Array(result.hash);
      return crypto.subtle.importKey('raw', raw, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    }

    async function decryptEncryptedDocumentWithPassphrase(doc, passphrase) {
      const files = (doc.files || []).filter(f => f.file_type === 'original');
      const original = files[0];
      if (!original) throw new Error('Encrypted file not found');

      const env = doc.encryption_metadata?.files?.upload;
      if (!env?.wrapped_dek?.salt_b64 || !env?.wrapped_dek?.wrap_iv_b64 || !env?.wrapped_dek?.wrapped_dek_b64 || !env?.iv_b64) {
        throw new Error('Encrypted metadata is incomplete');
      }

      const salt = b64ToBytes(env.wrapped_dek.salt_b64);
      const wrapIv = b64ToBytes(env.wrapped_dek.wrap_iv_b64);
      const wrappedDek = b64ToBytes(env.wrapped_dek.wrapped_dek_b64);
      const fileIv = b64ToBytes(env.iv_b64);
      const wrapKind = String(env.wrapped_dek.kind || 'passphrase_pbkdf2');
      const wrapKey = wrapKind === 'passphrase_argon2id'
        ? await deriveArgon2idKey(passphrase, salt, env.wrapped_dek.argon2id || {})
        : await derivePbkdf2Key(passphrase, salt, env.wrapped_dek.pbkdf2 || {});
      const rawDek = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: wrapIv, tagLength: 128 }, wrapKey, wrappedDek);
      const contentKey = await crypto.subtle.importKey('raw', rawDek, { name: 'AES-GCM' }, false, ['decrypt']);

      const encryptedBytes = new Uint8Array(await (await fetch(`api/documents/${doc.id}/files/${original.id}/download`)).arrayBuffer());
      const plaintext = new Uint8Array(await crypto.subtle.decrypt(
        { name: 'AES-GCM', iv: fileIv, tagLength: 128 },
        contentKey,
        encryptedBytes
      ));

      let fileMeta = { original_filename: 'decrypted-file.bin', mime_type: 'application/octet-stream' };
      if (env.encrypted_file_meta?.payload_b64 && env.encrypted_file_meta?.iv_b64) {
        const metaIv = b64ToBytes(env.encrypted_file_meta.iv_b64);
        const metaPayload = b64ToBytes(env.encrypted_file_meta.payload_b64);
        const metaBytes = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: metaIv, tagLength: 128 }, contentKey, metaPayload);
        fileMeta = JSON.parse(bytesToUtf8(new Uint8Array(metaBytes)));
      }

      const blob = new Blob([plaintext], { type: fileMeta.mime_type || 'application/octet-stream' });
      const objectUrl = URL.createObjectURL(blob);
      unlockedFiles.set(original.id, { blob, objectUrl, name: safeFileName(fileMeta.original_filename), mime: fileMeta.mime_type || blob.type });
      return { fileId: original.id, blob, objectUrl, name: safeFileName(fileMeta.original_filename), mime: fileMeta.mime_type || blob.type };
    }

    function renderEncryptedLockedState(doc) {
      const preview = document.getElementById('file-preview');
      preview.innerHTML = `
        <div style="max-width:460px; margin:0 auto; text-align:left; padding:1rem;">
          <div style="font-size:2rem; margin-bottom:0.5rem;">🔒</div>
          <div style="font-weight:600; margin-bottom:0.5rem;">Encrypted Document</div>
          <div class="text-dim text-sm mb-1">Mode: <strong>${esc(doc.encryption_mode || 'passphrase')}</strong></div>
          <div class="text-dim text-sm mb-1">This file is encrypted client-side. Enter passphrase to decrypt locally in your browser.</div>
          <div class="form-group mt-1">
            <label class="form-label">Passphrase</label>
            <input type="password" id="unlock-passphrase" class="form-input" placeholder="Enter passphrase">
          </div>
          <button id="unlock-btn" class="btn btn-primary">Unlock Document</button>
          <div id="unlock-status" class="text-sm mt-1 text-dim"></div>
        </div>`;

      const tbody = document.querySelector('#files-table tbody');
      const file = (doc.files || []).find(f => f.file_type === 'original');
      tbody.innerHTML = file ? `<tr>
        <td>Encrypted file</td>
        <td class="text-dim text-sm">original</td>
        <td class="text-dim text-sm">${formatBytes(file.file_size_bytes)}</td>
        <td class="text-dim text-sm">Locked</td>
      </tr>` : '<tr><td colspan="4" class="text-dim text-sm">No files</td></tr>';

      document.getElementById('add-file-btn').style.display = 'none';
      document.getElementById('create-share-btn').style.display = 'none';
      const reanalyzeBtn = document.querySelector('#doc-actions button[onclick="openReanalyzeModal()"]');
      if (reanalyzeBtn) reanalyzeBtn.disabled = true;

      const unlockBtn = document.getElementById('unlock-btn');
      unlockBtn.addEventListener('click', async () => {
        const passphrase = document.getElementById('unlock-passphrase').value || '';
        const status = document.getElementById('unlock-status');
        if (!passphrase) {
          status.textContent = 'Passphrase required';
          return;
        }
        unlockBtn.disabled = true;
        status.textContent = 'Decrypting locally...';
        try {
          const unlocked = await decryptEncryptedDocumentWithPassphrase(doc, passphrase);
          status.textContent = 'Unlocked';
          renderUnlockedFilePreview(unlocked);
          tbody.innerHTML = `<tr>
            <td>${esc(unlocked.name)}</td>
            <td class="text-dim text-sm">original</td>
            <td class="text-dim text-sm">${formatBytes(unlocked.blob.size)}</td>
            <td class="flex gap-1"><button class="btn btn-sm btn-primary" id="preview-unlocked-btn">View</button><button class="btn btn-sm" id="download-unlocked-btn">Download</button></td>
          </tr>`;
          document.getElementById('preview-unlocked-btn').addEventListener('click', () => renderUnlockedFilePreview(unlocked));
          document.getElementById('download-unlocked-btn').addEventListener('click', () => {
            const a = document.createElement('a');
            a.href = unlocked.objectUrl;
            a.download = unlocked.name;
            a.click();
          });
        } catch {
          status.textContent = 'Unlock failed. Check passphrase and try again.';
        } finally {
          unlockBtn.disabled = false;
        }
      });
    }

    function renderUnlockedFilePreview(unlocked) {
      const preview = document.getElementById('file-preview');
      if ((unlocked.mime || '').startsWith('image/')) {
        preview.innerHTML = `<div class="doc-preview-wrap fit-width"><img src="${unlocked.objectUrl}" class="doc-preview-img"></div>`;
      } else if (unlocked.mime === 'application/pdf') {
        preview.innerHTML = `<iframe src="${unlocked.objectUrl}" class="doc-preview-frame"></iframe>`;
      } else {
        preview.innerHTML = `<div class="flex-center" style="padding:2rem;"><a class="btn btn-primary" href="${unlocked.objectUrl}" download="${esc(unlocked.name)}">Download ${esc(unlocked.name)}</a></div>`;
      }
    }

    async function loadDocument() {
      try {
        const doc = await API.get(`api/documents/${docId}`);
        currentDoc = doc;

        document.getElementById('doc-title').textContent = doc.title;
        document.title = `Home Source — ${doc.title}`;

        // Actions
        const actions = document.getElementById('doc-actions');
        actions.innerHTML = `
          <button class="btn btn-sm" onclick="openEditModal()">Edit</button>
          <button class="btn btn-sm" onclick="openReanalyzeModal()">Re-analyze</button>
          <button class="btn btn-sm btn-danger" onclick="archiveDoc()">Archive</button>
          <button class="btn btn-sm btn-danger" onclick="deleteDoc()" style="opacity:0.7;">Delete</button>
        `;

        const encryptedDoc = isEncryptedDoc(doc);

        // File preview
        const files = doc.files || [];
        const isMobile = window.innerWidth <= 768;
        const originalImg = files.find(f => f.file_type === 'original' && f.mime_type.startsWith('image/'));
        const thumbnail = files.find(f => f.file_type === 'thumbnail');
        const pdfFile = files.find(f => f.file_type === 'processed' || (f.file_type === 'original' && f.mime_type === 'application/pdf'));
        const previewFile = isMobile
          ? (originalImg || thumbnail || pdfFile || files.find(f => f.file_type === 'original'))
          : (pdfFile || files.find(f => f.file_type === 'original'));
        const preview = document.getElementById('file-preview');
        if (!encryptedDoc && previewFile) {
          if (!isMobile && previewFile.mime_type === 'application/pdf') {
            preview.innerHTML = `<iframe src="api/documents/${docId}/files/${previewFile.id}/download" class="doc-preview-frame"></iframe>`;
          } else if (previewFile.mime_type.startsWith('image/') || (isMobile && thumbnail)) {
            const imgFile = previewFile.mime_type.startsWith('image/') ? previewFile : thumbnail;
            const downloadFile = pdfFile || files.find(f => f.file_type === 'original');
            preview.innerHTML = `
              <div class="doc-preview-toolbar">
                <button class="active" data-zoom="fit">Fit to width</button>
                <button data-zoom="actual">Full size</button>
                ${downloadFile ? `<a href="api/documents/${docId}/files/${downloadFile.id}/download" class="btn btn-sm" download>Download</a>` : ''}
              </div>
              <div class="doc-preview-wrap fit-width">
                <img src="api/documents/${docId}/files/${imgFile.id}/download" class="doc-preview-img">
              </div>`;
            preview.querySelectorAll('[data-zoom]').forEach(btn => {
              btn.addEventListener('click', () => {
                const wrap = preview.querySelector('.doc-preview-wrap');
                preview.querySelectorAll('[data-zoom]').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                wrap.className = 'doc-preview-wrap ' + (btn.dataset.zoom === 'fit' ? 'fit-width' : 'fit-actual');
              });
            });
          } else if (isMobile && previewFile.mime_type === 'application/pdf') {
            preview.innerHTML = `
              <div style="text-align:center; padding:2rem;">
                ${thumbnail ? `<img src="api/documents/${docId}/files/${thumbnail.id}/download" class="doc-preview-img" style="margin-bottom:1rem;">` : '<div style="font-size:3rem; margin-bottom:1rem;">📄</div>'}
                <a href="api/documents/${docId}/files/${previewFile.id}/download" class="btn btn-primary" download>Download PDF</a>
              </div>`;
          } else {
            preview.innerHTML = '<div class="text-dim">Preview not available</div>';
          }
        }

        // Files table
        const previewableFiles = files.filter(f => f.file_type !== 'thumbnail');
        const tbody = document.querySelector('#files-table tbody');
        tbody.innerHTML = !encryptedDoc ? previewableFiles.map(f => {
          const canPreview = f.mime_type === 'application/pdf' || f.mime_type.startsWith('image/');
          const isActive = previewFile && previewFile.id === f.id;
          return `<tr>
            <td>${esc(f.original_filename)}</td>
            <td class="text-dim text-sm">${f.file_type}</td>
            <td class="text-dim text-sm">${formatBytes(f.file_size_bytes)}</td>
            <td class="flex gap-1">
              ${canPreview ? `<button class="btn btn-sm${isActive ? ' btn-primary' : ''}" onclick="showPreview(${f.id})">View</button>` : ''}
              <a href="api/documents/${docId}/files/${f.id}/download" class="btn btn-sm" target="_blank">Download</a>
            </td>
          </tr>`;
        }).join('') : '';

        document.getElementById('add-file-btn').style.display = encryptedDoc ? 'none' : 'inline-flex';

        // Description
        if (doc.description) {
          document.getElementById('desc-card').style.display = 'block';
          document.getElementById('doc-description').textContent = doc.description;
        }

        // Metadata
        const meta = document.getElementById('doc-meta');
        const rows = [
          ['Type', `<span class="doc-card-type">${doc.document_type}</span>`],
          ['Source', doc.source_type],
          ['Status', doc.status],
          ['Created', new Date(doc.created_at).toLocaleDateString()]
        ];
        if (doc.issued_date) rows.push(['Issued', formatDateForDisplay(doc.issued_date)]);
        if (doc.expiry_date) rows.push(['Expires', `<span style="color:var(--warn);">${formatDateForDisplay(doc.expiry_date)}</span>`]);
        if (doc.source_url) rows.push(['Source URL', `<a href="${esc(doc.source_url)}" target="_blank" class="text-sm">Link</a>`]);
        if (doc.metadata && Object.keys(doc.metadata).length) {
          for (const [k, v] of Object.entries(doc.metadata)) {
            rows.push([k.replace(/_/g, ' '), formatMetadataValue(k, v)]);
          }
        }
        meta.innerHTML = '<div class="table-wrap"><table class="doc-meta-table">' + rows.map(([k, v]) => `<tr><td class="doc-meta-key text-dim text-sm">${k}</td><td class="doc-meta-value">${v}</td></tr>`).join('') + '</table></div>';

        // Owners
        renderOwners(doc.owners || []);
        document.getElementById('add-owner-btn').style.display = 'inline-flex';

        // Tags
        renderTags(doc.tags || []);
        document.getElementById('edit-tags-btn').style.display = 'inline-flex';

        // Share links
        document.getElementById('share-card').style.display = 'block';
        if (encryptedDoc) {
          document.getElementById('shares-list').innerHTML = '<span class="text-dim text-sm">Share links are unavailable for encrypted documents in v1.</span>';
          document.getElementById('create-share-btn').style.display = 'none';
        } else {
          document.getElementById('create-share-btn').style.display = 'inline-flex';
          loadShares();
        }
        document.getElementById('links-card').style.display = 'block';
        loadLinks();
        if (encryptedDoc) {
          renderEncryptedLockedState(doc);
        }

      } catch (err) {
        document.getElementById('doc-title').textContent = 'Document not found';
        console.error(err);
      }
    }

    function renderOwners(owners) {
      document.getElementById('owners-list').innerHTML = owners.length
        ? owners.map(o => `<div class="flex gap-1 mb-1" style="align-items:center;">
            <span style="font-size:1.2rem;">${o.avatar_emoji}</span>
            <span>${esc(o.name)}</span>
            <span class="text-xs text-muted">${o.ownership_type}</span>
            <button class="btn btn-sm btn-danger" style="margin-left:auto;" onclick="removeOwner(${o.id})">&times;</button>
          </div>`).join('')
        : '<span class="text-dim text-sm">No owners assigned</span>';
    }

    function renderTags(tags) {
      document.getElementById('tags-list').innerHTML = tags.length
        ? tags.map(t => `<span class="tag" style="background:${t.color}22;color:${t.color};">${esc(t.name)}</span>`).join('')
        : '<span class="text-dim text-sm">No tags</span>';
    }

    function formatMetadataValue(key, value) {
      if (value === null || value === undefined) return '<span class="text-dim">—</span>';
      if (typeof value !== 'object') return esc(String(value));

      if (key === 'magicindex') {
        const state = value.state || 'unknown';
        const provider = value.provider || 'unknown';
        const confidence = Number(value.confidence);
        const rawConfidence = Number(value.raw_confidence);
        const confidenceLabel = Number.isFinite(confidence)
          ? `${Math.round(confidence * 100)}%${Number.isFinite(rawConfidence) && Math.round(rawConfidence * 100) !== Math.round(confidence * 100) ? ` (raw ${Math.round(rawConfidence * 100)}%)` : ''}`
          : '—';
        const importItemId = Number(currentDoc?.metadata?.import_item_id || 0);
        const canApply = importItemId > 0 && value.state === 'complete' && value.applied_by_user !== true;
        const evidence = value.extraction_evidence?.source ? `<span class="text-xs text-dim">source: ${esc(value.extraction_evidence.source)}</span>` : '';
        const hint = value.user_hint ? `<span class="text-xs text-dim">hint: ${esc(value.user_hint)}</span>` : '';
        return `<div style="display:flex; flex-direction:column; gap:0.25rem;">
          <span><strong>${esc(state)}</strong> · ${esc(provider)} · ${confidenceLabel}</span>
          ${evidence}
          ${hint}
          <div><button class="btn btn-sm" onclick="openReanalyzeModal()">Re-analyze</button></div>
          ${canApply ? `<div><button class="btn btn-sm" onclick="applyMagicIndexFromDocument(${importItemId})">Apply suggestions</button></div>` : ''}
          <details>
            <summary class="text-sm text-dim" style="cursor:pointer;">View raw MagicIndex JSON</summary>
            <pre class="text-xs" style="margin-top:0.5rem; white-space:pre-wrap; overflow-wrap:anywhere; word-break:break-word; max-width:320px; max-height:220px; overflow:auto;">${esc(JSON.stringify(value, null, 2))}</pre>
          </details>
        </div>`;
      }

      return `<details>
        <summary class="text-sm text-dim" style="cursor:pointer;">View JSON</summary>
        <pre class="text-xs" style="margin-top:0.5rem; white-space:pre-wrap; overflow-wrap:anywhere; word-break:break-word; max-width:320px; max-height:220px; overflow:auto;">${esc(JSON.stringify(value, null, 2))}</pre>
      </details>`;
    }

    function linkTypeLabel(link) {
      const type = link.link_type;
      const direction = link.direction;
      if (type === 'supersedes') return direction === 'outgoing' ? 'Supersedes' : 'Superseded by';
      if (type === 'renews') return direction === 'outgoing' ? 'Renews' : 'Renewed by';
      if (type === 'supplements') return direction === 'outgoing' ? 'Supplements' : 'Supplemented by';
      if (type === 'same_asset') return 'Same asset';
      if (type === 'same_account') return 'Same account';
      if (type === 'same_provider') return 'Same provider';
      return 'Relates to';
    }

    function showPreview(fileId) {
      const file = (currentDoc.files || []).find(f => f.id === fileId);
      if (!file) return;
      const preview = document.getElementById('file-preview');
      const isMobile = window.innerWidth <= 768;

      if (!isMobile && file.mime_type === 'application/pdf') {
        preview.innerHTML = `<iframe src="api/documents/${docId}/files/${file.id}/download" class="doc-preview-frame"></iframe>`;
      } else if (file.mime_type.startsWith('image/')) {
        const downloadFile = (currentDoc.files || []).find(f => f.file_type === 'processed' || (f.file_type === 'original' && f.mime_type === 'application/pdf')) || file;
        preview.innerHTML = `
          <div class="doc-preview-toolbar">
            <button class="active" data-zoom="fit">Fit to width</button>
            <button data-zoom="actual">Full size</button>
            <a href="api/documents/${docId}/files/${downloadFile.id}/download" class="btn btn-sm" download>Download</a>
          </div>
          <div class="doc-preview-wrap fit-width">
            <img src="api/documents/${docId}/files/${file.id}/download" class="doc-preview-img">
          </div>`;
        preview.querySelectorAll('[data-zoom]').forEach(btn => {
          btn.addEventListener('click', () => {
            const wrap = preview.querySelector('.doc-preview-wrap');
            preview.querySelectorAll('[data-zoom]').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            wrap.className = 'doc-preview-wrap ' + (btn.dataset.zoom === 'fit' ? 'fit-width' : 'fit-actual');
          });
        });
      } else if (isMobile && file.mime_type === 'application/pdf') {
        const thumbnail = (currentDoc.files || []).find(f => f.file_type === 'thumbnail');
        preview.innerHTML = `
          <div style="text-align:center; padding:2rem;">
            ${thumbnail ? `<img src="api/documents/${docId}/files/${thumbnail.id}/download" class="doc-preview-img" style="margin-bottom:1rem;">` : '<div style="font-size:3rem; margin-bottom:1rem;">📄</div>'}

          </div>`;
      } else {
        preview.innerHTML = '<div class="text-dim flex-center" style="padding:2rem;">Preview not available for this file type</div>';
      }

      document.querySelector('#files-table tbody').querySelectorAll('.btn-primary').forEach(b => b.classList.remove('btn-primary'));

    // Utils
    function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
    function formatBytes(b) {
      if (b < 1024) return b + ' B';
      if (b < 1048576) return (b / 1024).toFixed(1) + ' KB';
      return (b / 1048576).toFixed(1) + ' MB';
    }
    function toast(msg, type = 'success') {
      const el = document.createElement('div');
      el.className = `toast toast-${type}`;
      el.textContent = msg;
      document.getElementById('toasts').appendChild(el);
      setTimeout(() => el.remove(), 4000);
    }

    // MagicIndex polling — start when status is pending, stop when done
    let _miPollInterval = null;

    function startMagicIndexPolling() {
      if (_miPollInterval) return;
      _miPollInterval = setInterval(async () => {
        try {
          const status = await API.get(`api/documents/${docId}/magicindex-status`);
          const state = status.state;
          if (state && state !== 'pending') {
            clearInterval(_miPollInterval);
            _miPollInterval = null;
            // Patch currentDoc metadata and re-render affected sections
            if (!currentDoc) return;
            currentDoc.metadata = { ...(currentDoc.metadata || {}), magicindex: status.magicindex };
            currentDoc.title = status.title;
            currentDoc.description = status.description;
            currentDoc.tags = status.tags || [];
            // Re-render metadata rows
            const meta = document.getElementById('doc-meta');
            const rows = [
              ['Type', `<span class="doc-card-type">${currentDoc.document_type}</span>`],
              ['Source', currentDoc.source_type],
              ['Status', currentDoc.status],
              ['Created', new Date(currentDoc.created_at).toLocaleDateString()]
            ];
            if (currentDoc.issued_date) rows.push(['Issued', formatDateForDisplay(currentDoc.issued_date)]);
            if (currentDoc.expiry_date) rows.push(['Expires', `<span style="color:var(--warn);">${formatDateForDisplay(currentDoc.expiry_date)}</span>`]);
            if (currentDoc.source_url) rows.push(['Source URL', `<a href="${esc(currentDoc.source_url)}" target="_blank" class="text-sm">Link</a>`]);
            if (currentDoc.metadata && Object.keys(currentDoc.metadata).length) {
              for (const [k, v] of Object.entries(currentDoc.metadata)) {
                rows.push([k.replace(/_/g, ' '), formatMetadataValue(k, v)]);
              }
            }
            meta.innerHTML = '<table>' + rows.map(([k, v]) => `<tr><td class="text-dim text-sm" style="white-space:nowrap;">${k}</td><td>${v}</td></tr>`).join('') + '</table>';
            // Re-render tags
            renderTags(currentDoc.tags);
            // Re-render title and description if they changed
            document.getElementById('doc-title').textContent = currentDoc.title;
            document.title = `Home Source — ${currentDoc.title}`;
            if (currentDoc.description) {
              document.getElementById('desc-card').style.display = 'block';
              document.getElementById('doc-description').textContent = currentDoc.description;
            }
          }
        } catch (_) { /* ignore poll errors */ }
      }, 3500);
    }

    function maybeStartMagicIndexPolling(doc) {
      if (doc.metadata?.magicindex?.state === 'pending') startMagicIndexPolling();
    }

    loadDocument().then(() => {
      if (currentDoc) maybeStartMagicIndexPolling(currentDoc);
    });
  </script>
</body>
</html>
