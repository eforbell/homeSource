<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0b">
  <meta name="referrer" content="no-referrer">
  <title>Home Source — Private delivery</title>
  <link rel="icon" href="favicon.svg">
  <link rel="stylesheet" href="sovereign-fonts.css"><link rel="stylesheet" href="sovereign-chassis.css"><link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="source-skin.css"><link rel="stylesheet" href="style.css">
  <script src="theme.js"></script><script src="pki-crypto.js"></script>
</head>
<body>
  <main class="page-content" style="max-width:560px; margin:4rem auto; padding:1.5rem;">
    <section class="card" aria-labelledby="page-title">
      <div style="font-size:2rem" aria-hidden="true">🔒</div>
      <h1 id="page-title">Private delivery</h1>
      <p id="summary" class="text-dim">Opening your private delivery…</p>
      <div id="items" class="stack" hidden></div>
      <section id="unlock" hidden aria-labelledby="unlock-title" style="margin-top:1.25rem;">
        <h2 id="unlock-title" style="font-size:1.1rem">Unlock selected item</h2>
        <label class="form-label" for="passphrase">Key passphrase</label>
        <input id="passphrase" class="form-input" type="password" autocomplete="current-password" placeholder="Enter your key passphrase">
        <div class="modal-actions" style="justify-content:flex-start; margin-top:.75rem">
          <button id="unlock-button" class="btn btn-primary" type="button">Unlock locally</button>
          <button id="passkey-button" class="btn" type="button" hidden>Use passkey</button>
        </div>
      </section>
      <p id="status" class="form-hint" role="status" aria-live="polite"></p>
      <button id="reissue-button" class="btn" type="button" hidden>Send a replacement link</button>
      <div id="result" hidden style="margin-top:1rem"></div>
      <p class="form-hint">Before unlock, item names stay private. Your key and document are decrypted only in this browser.</p>
    </section>
  </main>
  <script>
  'use strict';
  const summary = document.getElementById('summary'); const itemsEl = document.getElementById('items');
  const unlockEl = document.getElementById('unlock'); const statusEl = document.getElementById('status');
  const resultEl = document.getElementById('result'); const passkeyButton = document.getElementById('passkey-button');
  const token = new URLSearchParams(location.search).get('token') || ''; let bearer = null; let selectedOrdinal = null; let selectedItem = null;
  const reissueButton = document.getElementById('reissue-button');
  function authHeaders() { return { Authorization: `Bearer ${bearer}` }; }
  async function api(path, options = {}) {
    const response = await fetch(path, { ...options, headers: { ...authHeaders(), ...(options.headers || {}) }, cache: 'no-store', credentials: 'omit' });
    if (!response.ok) throw new Error('This private delivery is unavailable or has expired.');
    return response;
  }
  function bytes(value) { return PKICrypto.fromBase64(value); }
  function text(bytesValue) { return new TextDecoder().decode(bytesValue); }
  function safeName(value) { return String(value || 'private-document.bin').replace(/[\\/:*?"<>|]/g, '_').trim() || 'private-document.bin'; }
  async function getPasskeyKek() {
    const response = await api(`api/continuity/recipient/items/${selectedOrdinal}/webauthn/assertion-options`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' });
    const payload = await response.json();
    statusEl.textContent = 'Complete your security-key sign-in…';
    const assertion = await navigator.credentials.get({ publicKey: PKICrypto.toPublicKeyRequestOptions(payload.options) });
    const prf = assertion?.getClientExtensionResults?.()?.prf?.results?.first;
    if (!prf) throw new Error('This passkey did not provide the required local unlock material.');
    return PKICrypto.deriveKekFromPrf(prf);
  }
  async function unlock(usePasskey = false) {
    if (!selectedOrdinal) return;
    const button = usePasskey ? passkeyButton : document.getElementById('unlock-button');
    button.disabled = true; statusEl.textContent = 'Loading encrypted private material…'; resultEl.hidden = true;
    try {
      selectedItem = await (await api(`api/continuity/recipient/items/${selectedOrdinal}`)).json();
      const material = selectedItem.key_material; const wrapped = PKICrypto.parseWrappedPrivateKeyPayload(material);
      const kek = usePasskey ? await getPasskeyKek() : await PKICrypto.deriveKekFromPassphrase(document.getElementById('passphrase').value, PKICrypto.fromBase64(wrapped.salt_b64)).then(({ kek }) => kek);
      statusEl.textContent = 'Unlocking your private key locally…';
      const privateKey = await PKICrypto.unwrapPrivateKey(bytes(wrapped.wrapped_private_key_b64), kek);
      statusEl.textContent = 'Unwrapping document key locally…';
      const wrappedDek = selectedItem.artifact.wrapped_dek;
      const dek = await PKICrypto.unwrapDekAsOwner(bytes(wrappedDek.wrapped_dek_b64), bytes(wrappedDek.ephemeral_public_key_b64), bytes(wrappedDek.hkdf_salt_b64), privateKey);
      statusEl.textContent = 'Decrypting locally…';
      const ciphertext = new Uint8Array(await (await api(`api/continuity/recipient/items/${selectedOrdinal}/ciphertext`)).arrayBuffer());
      const artifact = selectedItem.artifact;
      const plaintext = new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(artifact.iv_b64), tagLength: Number(artifact.tag_length_bits || 128) }, dek, ciphertext));
      let metadata = { original_filename: 'private-document.bin', mime_type: 'application/octet-stream' };
      if (artifact.encrypted_file_meta?.payload_b64 && artifact.encrypted_file_meta?.iv_b64) {
        metadata = JSON.parse(text(new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(artifact.encrypted_file_meta.iv_b64), tagLength: 128 }, dek, bytes(artifact.encrypted_file_meta.payload_b64)))));
      }
      const blob = new Blob([plaintext], { type: metadata.mime_type || 'application/octet-stream' }); const link = document.createElement('a');
      link.href = URL.createObjectURL(blob); link.download = safeName(metadata.original_filename); link.className = 'btn btn-primary'; link.textContent = `Download ${safeName(metadata.original_filename)}`;
      resultEl.replaceChildren(link); resultEl.hidden = false; statusEl.textContent = 'Unlocked locally. The download name is visible only after decryption.';
    } catch (error) { statusEl.textContent = error.message || 'Unable to unlock this item.'; }
    finally { button.disabled = false; }
  }
  async function choose(ordinal) {
    selectedOrdinal = ordinal; unlockEl.hidden = false; resultEl.hidden = true;
    statusEl.textContent = `Private document ${ordinal} selected.`;
    try {
      selectedItem = await (await api(`api/continuity/recipient/items/${ordinal}`)).json();
      passkeyButton.hidden = !(selectedItem.key_material.credential_verified && selectedItem.key_material.credential_id);
    } catch (error) { statusEl.textContent = error.message; }
  }
  async function start() {
    try {
      const response = await fetch('api/continuity/recipient/exchange', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token }), cache: 'no-store', credentials: 'omit' });
      if (!response.ok) throw new Error('This private delivery is unavailable or has expired.');
      const exchanged = await response.json(); bearer = exchanged.bearer; history.replaceState(null, '', 'recipient-delivery.html');
      summary.textContent = 'Select a private item to unlock in this browser.'; itemsEl.hidden = false;
      for (const item of exchanged.items) { const button = document.createElement('button'); button.type = 'button'; button.className = 'btn'; button.textContent = item.label; button.addEventListener('click', () => choose(item.ordinal)); itemsEl.append(button); }
      if (!exchanged.items.length) throw new Error('This private delivery is unavailable or has expired.');
    } catch (error) { summary.textContent = error.message; reissueButton.hidden = !token; }
  }
  reissueButton.addEventListener('click', async () => {
    reissueButton.disabled = true;
    try {
      await fetch('api/continuity/recipient/reissue', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token }), cache: 'no-store', credentials: 'omit' });
      summary.textContent = 'If this delivery remains available, a replacement link will be sent to its verified address.';
      reissueButton.hidden = true;
    } finally { reissueButton.disabled = false; }
  });
  document.getElementById('unlock-button').addEventListener('click', () => unlock(false));
  passkeyButton.addEventListener('click', () => unlock(true));
  start();
  </script>
</body>
</html>
