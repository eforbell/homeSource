<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0b">
  <title>Home Source — Documents</title>
  <link rel="icon" href="favicon.svg">
  <link rel="stylesheet" href="sovereign-fonts.css">
  <link rel="stylesheet" href="sovereign-chassis.css">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="source-skin.css">
  <link rel="stylesheet" href="style.css">
  <script src="theme.js"></script>
</head>
<body data-nav-page="documents">
  <div class="page-content">
    <div class="page-header">
      <h1>Documents</h1>
      <a href="upload.html" class="btn btn-primary">+ Upload</a>
    </div>

    <!-- Browse pills: popular types and tags -->
    <div id="browse-pills" class="browse-pills" style="display:none;"></div>

    <!-- Active filter indicator -->
    <div id="active-filter" class="active-filter" style="display:none;"></div>

    <div class="filters-bar">
      <input type="search" id="filter-search" class="form-input" placeholder="Search..." style="min-width:200px;">
      <select id="filter-type" class="form-select">
        <option value="">All Types</option>
        <option value="warranty">Warranty</option>
        <option value="insurance">Insurance</option>
        <option value="certificate">Certificate</option>
        <option value="manual">Manual</option>
        <option value="receipt">Receipt</option>
        <option value="contract">Contract</option>
        <option value="medical">Medical</option>
        <option value="legal">Legal</option>
        <option value="tax">Tax</option>
        <option value="identification">ID</option>
        <option value="property">Property</option>
        <option value="vehicle">Vehicle</option>
        <option value="notice">Notice</option>
        <option value="employment">Employment</option>
        <option value="other">Other</option>
      </select>
      <select id="filter-owner" class="form-select">
        <option value="">All Owners</option>
      </select>
      <select id="filter-tag" class="form-select">
        <option value="">All Tags</option>
      </select>
    </div>

    <div id="doc-grid" class="doc-grid"></div>
    <div id="doc-empty" class="empty-state" style="display:none;">
      <div class="empty-state-icon">📂</div>
      <div class="empty-state-title">No documents found</div>
      <p class="text-dim">Try adjusting your filters or upload a new document.</p>
    </div>

    <div id="pagination" class="flex-center gap-1 mt-2" style="display:none;">
      <button id="prev-btn" class="btn btn-sm" disabled>Previous</button>
      <span id="page-info" class="text-dim text-sm"></span>
      <button id="next-btn" class="btn btn-sm">Next</button>
    </div>
  </div>

  <!-- Confirm modal -->
  <div class="modal-backdrop hidden" id="confirm-modal">
    <div class="modal">
      <div class="modal-title" id="confirm-title">Confirm</div>
      <p id="confirm-message" class="text-dim" style="margin-bottom:1rem;"></p>
      <div class="modal-actions">
        <button class="btn" id="confirm-cancel-btn">Cancel</button>
        <button class="btn btn-danger" id="confirm-ok-btn">Confirm</button>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toasts"></div>

  <script src="api.js"></script>
  <script src="nav.js"></script>
  <script>
    'use strict';

    function showConfirm(title, message) {
      return new Promise(resolve => {
        document.getElementById('confirm-title').textContent = title;
        document.getElementById('confirm-message').textContent = message;
        const modal = document.getElementById('confirm-modal');
        const okBtn = document.getElementById('confirm-ok-btn');
        const cancelBtn = document.getElementById('confirm-cancel-btn');
        modal.classList.remove('hidden');
        function cleanup(result) {
          modal.classList.add('hidden');
          okBtn.removeEventListener('click', onOk);
          cancelBtn.removeEventListener('click', onCancel);
          resolve(result);
        }
        function onOk() { cleanup(true); }
        function onCancel() { cleanup(false); }
        okBtn.addEventListener('click', onOk);
        cancelBtn.addEventListener('click', onCancel);
      });
    }

    function toast(msg, type = 'success') {
      const el = document.createElement('div');
      el.className = `toast toast-${type}`;
      el.textContent = msg;
      document.getElementById('toasts').appendChild(el);
      setTimeout(() => el.remove(), 4000);
    }

    const PAGE_SIZE = 24;
    let currentOffset = 0;

    async function loadDocuments() {
      const params = new URLSearchParams();
      const q = document.getElementById('filter-search').value.trim();
      const type = document.getElementById('filter-type').value;
      const owner = document.getElementById('filter-owner').value;
      const tag = document.getElementById('filter-tag').value;

      if (q) params.set('q', q);
      if (type) params.set('type', type);
      if (owner) params.set('owner', owner);
      if (tag) params.set('tag', tag);
      params.set('limit', PAGE_SIZE);
      params.set('offset', currentOffset);

      try {
        const { documents, total } = await API.get('api/documents?' + params);
        const grid = document.getElementById('doc-grid');
        const empty = document.getElementById('doc-empty');
        const pag = document.getElementById('pagination');

        if (!documents.length) {
          grid.innerHTML = '';
          empty.style.display = 'block';
          pag.style.display = 'none';
          return;
        }

        empty.style.display = 'none';
        grid.innerHTML = documents.map(d => {
          const thumb = d.thumbnail ? `<img src="api/thumbnails/${d.thumbnail.stored_filename.split('/').pop()}" alt="">` : `<div class="doc-placeholder">📄</div>`;
          const owners = (d.owners || []).map(o => `<span class="avatar" title="${esc(o.name)}">${o.avatar_emoji}</span>`).join('');
          const tags = (d.tags || []).map(t =>
            `<span class="tag browse-link" data-browse="tag" data-id="${t.id}" style="background:${t.color}22; color:${t.color}; cursor:pointer;">${esc(t.name)}</span>`
          ).join('');

          return `<div class="doc-card" onclick="location.href='document.html?id=${d.id}'">
            <div class="doc-card-thumb">${thumb}</div>
            <div class="doc-card-body">
              <div class="doc-card-title">${esc(d.title)}</div>
              <span class="doc-card-type browse-link" data-browse="type" data-id="${d.document_type}" style="cursor:pointer;">${d.document_type}</span>
              ${tags ? '<div class="tags-list mt-1">' + tags + '</div>' : ''}
              <div class="doc-card-meta">
                <div class="doc-card-owners">${owners}</div>
                <span>${new Date(d.created_at).toLocaleDateString()}</span>
              </div>
            </div>
            <button class="doc-card-delete" data-doc-id="${d.id}" data-doc-title="${esc(d.title)}" title="Delete">&times;</button>
          </div>`;
        }).join('');

        grid.querySelectorAll('.browse-link').forEach(el => {
          el.addEventListener('click', (e) => {
            e.stopPropagation();
            resetFilterValues();
            if (el.dataset.browse === 'tag') {
              document.getElementById('filter-tag').value = el.dataset.id;
            } else if (el.dataset.browse === 'type') {
              document.getElementById('filter-type').value = el.dataset.id;
            }
            currentOffset = 0;
            loadDocuments();
            updateActiveFilter();
          });
        });

        grid.querySelectorAll('.doc-card-delete').forEach(btn => {
          btn.addEventListener('click', async (e) => {
            e.stopPropagation();
            const id = btn.dataset.docId;
            const title = btn.dataset.docTitle;
            if (!await showConfirm('Delete Document', `Permanently delete "${title}" and all its files? This cannot be undone.`)) return;
            try {
              await API.del(`api/documents/${id}?permanent=true`);
              toast('Document deleted', 'success');
              loadDocuments();
            } catch (err) { toast(err.message, 'error'); }
          });
        });

        // Pagination
        if (total > PAGE_SIZE) {
          pag.style.display = 'flex';
          document.getElementById('prev-btn').disabled = currentOffset === 0;
          document.getElementById('next-btn').disabled = currentOffset + PAGE_SIZE >= total;
          document.getElementById('page-info').textContent = `${currentOffset + 1}–${Math.min(currentOffset + PAGE_SIZE, total)} of ${total}`;
        } else {
          pag.style.display = 'none';
        }
      } catch (err) {
        console.error('Load error:', err);
      }
    }

    async function loadFilters() {
      try {
        const [members, tags, { documents }] = await Promise.all([
          API.get('api/members'),
          API.get('api/tags'),
          API.get('api/documents?limit=200')
        ]);
        const ownerSelect = document.getElementById('filter-owner');
        for (const m of members) {
          ownerSelect.innerHTML += `<option value="${m.id}">${m.avatar_emoji} ${esc(m.name)}</option>`;
        }
        const tagSelect = document.getElementById('filter-tag');
        for (const t of tags) {
          tagSelect.innerHTML += `<option value="${t.id}">${esc(t.name)}</option>`;
        }
        buildBrowsePills(documents, tags);
      } catch {}
    }

    function buildBrowsePills(documents, tags) {
      const pills = document.getElementById('browse-pills');

      const typeCounts = {};
      for (const d of documents) {
        typeCounts[d.document_type] = (typeCounts[d.document_type] || 0) + 1;
      }
      const topTypes = Object.entries(typeCounts)
        .sort((a, b) => b[1] - a[1])
        .slice(0, 6);

      const tagsWithDocs = tags.filter(t => t.document_count > 0)
        .sort((a, b) => b.document_count - a.document_count)
        .slice(0, 8);

      if (!topTypes.length && !tagsWithDocs.length) return;

      let html = '';
      if (topTypes.length) {
        html += topTypes.map(([type, count]) =>
          `<button class="browse-pill browse-pill-type" data-browse="type" data-id="${type}">
            ${type} <span class="browse-pill-count">${count}</span>
          </button>`
        ).join('');
      }
      if (tagsWithDocs.length) {
        html += tagsWithDocs.map(t =>
          `<button class="browse-pill browse-pill-tag" data-browse="tag" data-id="${t.id}" style="--tag-color:${t.color};">
            ${esc(t.name)} <span class="browse-pill-count">${t.document_count}</span>
          </button>`
        ).join('');
      }

      pills.innerHTML = html;
      pills.style.display = 'flex';

      pills.querySelectorAll('.browse-pill').forEach(btn => {
        btn.addEventListener('click', () => {
          resetFilterValues();
          if (btn.dataset.browse === 'type') {
            document.getElementById('filter-type').value = btn.dataset.id;
          } else {
            document.getElementById('filter-tag').value = btn.dataset.id;
          }
          currentOffset = 0;
          loadDocuments();
          updateActiveFilter();
        });
      });
    }

    function updateActiveFilter() {
      const el = document.getElementById('active-filter');
      const type = document.getElementById('filter-type').value;
      const tag = document.getElementById('filter-tag').value;
      const owner = document.getElementById('filter-owner').value;
      const tagSelect = document.getElementById('filter-tag');
      const ownerSelect = document.getElementById('filter-owner');

      const parts = [];
      if (type) parts.push(`Type: <strong>${type}</strong>`);
      if (tag) {
        const tagName = tagSelect.options[tagSelect.selectedIndex]?.text || tag;
        parts.push(`Tag: <strong>${esc(tagName)}</strong>`);
      }
      if (owner) {
        const ownerName = ownerSelect.options[ownerSelect.selectedIndex]?.text || owner;
        parts.push(`Owner: <strong>${esc(ownerName)}</strong>`);
      }

      if (parts.length) {
        el.innerHTML = parts.join(' &middot; ') + ' <button class="btn btn-sm" onclick="clearFilters()">Clear</button>';
        el.style.display = 'flex';
      } else {
        el.style.display = 'none';
      }
    }

    function resetFilterValues() {
      document.getElementById('filter-type').value = '';
      document.getElementById('filter-tag').value = '';
      document.getElementById('filter-owner').value = '';
      document.getElementById('filter-search').value = '';
    }

    function clearFilters() {
      resetFilterValues();
      currentOffset = 0;
      loadDocuments();
      updateActiveFilter();
    }

    let searchTimeout;
    document.getElementById('filter-search').addEventListener('input', () => {
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(() => { currentOffset = 0; loadDocuments(); }, 300);
    });

    for (const id of ['filter-type', 'filter-owner', 'filter-tag']) {
      document.getElementById(id).addEventListener('change', () => { currentOffset = 0; loadDocuments(); updateActiveFilter(); });
    }

    document.getElementById('prev-btn').addEventListener('click', () => { currentOffset = Math.max(0, currentOffset - PAGE_SIZE); loadDocuments(); });
    document.getElementById('next-btn').addEventListener('click', () => { currentOffset += PAGE_SIZE; loadDocuments(); });

    function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

    loadFilters();
    loadDocuments();
  </script>
</body>
</html>
